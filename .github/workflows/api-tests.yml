name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"
      - "phase-*/**"

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python_tests_required: ${{ steps.changed-files.outputs.python_tests_required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "$empty_tree" "${{ github.sha }}"
          fi

      - name: Detect changes requiring Python tests
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"
          trap 'rm -f "$changed_files"' EXIT

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only --no-renames -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > "$changed_files"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only --no-renames -z "${{ github.event.before }}" "${{ github.sha }}" > "$changed_files"
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --name-only --no-renames -z "$empty_tree" "${{ github.sha }}" > "$changed_files"
          fi

          echo "Changed files:"
          python_tests_required=false
          while IFS= read -r -d '' changed_file; do
            printf -- '- %q\n' "$changed_file"
            case "$changed_file" in
              *.md|apps/web/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|infra/docker/web.Dockerfile)
                ;;
              *)
                python_tests_required=true
                ;;
            esac
          done < "$changed_files"

          echo "python_tests_required=$python_tests_required" >> "$GITHUB_OUTPUT"

  api-tests:
    name: API unittest
    needs: detect-changes
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail when change detection is invalid
        if: >-
          needs.detect-changes.result != 'success' ||
          (needs.detect-changes.outputs.python_tests_required != 'true' &&
          needs.detect-changes.outputs.python_tests_required != 'false')
        run: |
          echo "Change detection or whitespace check failed, or its output is invalid."
          exit 1

      - name: Skip API unit tests
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'false'
        run: echo "No changes requiring Python tests. Skipping API unit tests."

      - name: Checkout repository
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Run API unit tests
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
        working-directory: apps/api
        env:
          PYTHONPATH: src
        run: uv run --locked python -m unittest discover -s tests

  scraper-tests:
    name: Scraper unittest
    needs: detect-changes
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail when change detection is invalid
        if: >-
          needs.detect-changes.result != 'success' ||
          (needs.detect-changes.outputs.python_tests_required != 'true' &&
          needs.detect-changes.outputs.python_tests_required != 'false')
        run: |
          echo "Change detection or whitespace check failed, or its output is invalid."
          exit 1

      - name: Skip scraper unit tests
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'false'
        run: echo "No changes requiring Python tests. Skipping scraper unit tests."

      - name: Checkout repository
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Run scraper unit tests
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
        working-directory: packages/scraper
        env:
          PYTHONPATH: src
        run: uv run --locked python -m unittest discover -s tests

  db-integration-tests:
    name: PostgreSQL integration
    needs: detect-changes
    if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python_tests_required == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: presswatch_test
          POSTGRES_USER: presswatch_test
          POSTGRES_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U presswatch_test -d presswatch_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Run PostgreSQL integration tests
        working-directory: apps/api
        env:
          PYTHONPATH: src
          PRESSWATCH_TEST_POSTGRES_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run --locked python -m integration_tests.run
