name: press-watch-postgresql-integration

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: presswatch_test
      POSTGRES_USER: presswatch_test
      POSTGRES_PASSWORD: ${PRESSWATCH_TEST_POSTGRES_PASSWORD:?PRESSWATCH_TEST_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presswatch_test -d presswatch_test"]
      interval: 2s
      timeout: 5s
      retries: 10
